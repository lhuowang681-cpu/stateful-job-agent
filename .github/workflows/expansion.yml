name: expansion-offline
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts-and-offline-retrieval:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install '.[dev,workbench]' -c docs/evaluation/expansion/requirements-ci-review-linux-20261023.txt
      - run: python scripts/expansion_ci.py --output output/ci-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts && npm test && npm run build
        working-directory: frontend
